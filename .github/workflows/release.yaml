name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@8fd4d28659d28d3cc5ec2d0d7e1ddb25da954da7 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
