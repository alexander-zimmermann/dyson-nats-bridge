name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@031be5b815326bfaa7aa5c1a845b5e3dbde3aa73 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
