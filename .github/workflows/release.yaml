name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@5fa02263f2da87e9c5d0bcf0bd8e21d83e88dac5 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
