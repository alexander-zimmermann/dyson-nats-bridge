name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@b7f9eed03587d1e5b7ecfd4233d2ce2ced10b8d3 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
